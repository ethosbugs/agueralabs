<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agüera Labs</title>
  <meta name="description" content="Laboratorio de proyectos de Agüera Labs." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23065F46' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FAFAFA',
            ink: '#0F172A',
            accent: { DEFAULT: '#065F46', light: '#047857' },
            line: '#E2E8F0'
          },
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    .chevron { transition: transform .2s ease; }
    [aria-expanded="true"] .chevron { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
  </style>
</head>

<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div class="mx-auto max-w-3xl px-5 sm:px-8">

    <header class="pt-14 pb-8">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-accent text-white" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3" />
          </svg>
        </span>
        <h1 class="text-3xl font-bold tracking-tight">Agüera Labs</h1>
      </div>
      <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
        <p class="text-slate-600">Un laboratorio de proyectos, ideas y experimentos.</p>
        <p id="counter" class="rounded-full border border-line bg-white px-3 py-1 text-sm font-medium text-accent" aria-live="polite">
          Cargando…
        </p>
      </div>
    </header>

    <div class="pb-6">
      <label for="search" class="sr-only">Buscar proyectos</label>
      <div class="relative">
        <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input id="search" type="search" autocomplete="off" placeholder="Buscar por nombre o etiqueta"
          class="w-full rounded-lg border border-line bg-white py-3 pl-11 pr-4 text-base placeholder:text-slate-400 focus:border-accent focus:outline-none focus:ring-2 focus:ring-accent/20" />
      </div>
    </div>

    <main class="pb-20">
      <ul id="project-list" class="overflow-hidden rounded-xl border border-line bg-white divide-y divide-line"></ul>

      <p id="message" class="hidden rounded-xl border border-line bg-white px-5 py-10 text-center text-slate-600"></p>
    </main>

    <footer class="border-t border-line py-8 text-sm text-slate-500">
      © <span id="year"></span> Agüera Labs
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
